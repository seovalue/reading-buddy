<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>book buddy</title>
    <meta property="og:title" content="book buddy - 독서 인증">
    <meta property="og:description" content="독서 시간을 기록하고 인증하세요">
    <meta property="og:type" content="website">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #121212;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            background: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 24px;
            max-width: 100%;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 32px;
            font-size: 1.75em;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .timer-display {
            text-align: center;
            font-size: 2.5em;
            font-weight: 300;
            color: #ffffff;
            margin: 32px 0;
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 2px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        button {
            width: 100%;
            padding: 16px 24px;
            font-size: 1em;
            border: 2px solid #ffffff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            background: #1e1e1e;
            color: #ffffff;
        }

        .btn-start:hover:not(:disabled) {
            background: #ffffff;
            color: #000000;
        }

        .btn-complete:hover:not(:disabled) {
            background: #ffffff;
            color: #000000;
        }

        .btn-share {
            width: 100%;
        }

        .btn-share:hover:not(:disabled) {
            background: #ffffff;
            color: #000000;
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background: #1e1e1e;
            border-color: #444444;
            color: #666666;
        }

        .record-section {
            margin-top: 24px;
            padding: 20px;
            background: #2a2a2a;
            border: 1px solid #333333;
            border-radius: 8px;
            display: none;
        }

        .record-section.active {
            display: block;
        }

        .record-item {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #333333;
        }

        .record-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .record-label {
            font-weight: 500;
            color: #999999;
            margin-bottom: 6px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .record-value {
            color: #ffffff;
            font-size: 1em;
            font-weight: 400;
        }

        .photo-preview {
            margin-top: 20px;
            text-align: center;
        }

        .photo-preview img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #333333;
        }

        .camera-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .camera-modal.active {
            display: flex;
        }

        .camera-container {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            max-width: 95%;
            max-height: 95%;
            border: 1px solid #333333;
        }

        .camera-container video {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid #333333;
        }

        .camera-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .camera-buttons button {
            padding: 14px 28px;
            flex: 1;
        }

        .btn-capture {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .btn-capture:hover {
            background: #cccccc;
            border-color: #cccccc;
        }

        .btn-cancel {
            background: #1e1e1e;
            color: #ffffff;
            border-color: #ffffff;
        }

        .btn-cancel:hover {
            background: #ffffff;
            color: #000000;
        }

        @media (min-width: 480px) {
            .container {
                max-width: 420px;
                padding: 32px;
            }

            h1 {
                font-size: 2em;
            }

            .timer-display {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>book buddy</h1>
        
        <div class="timer-display" id="timerDisplay">00:00:00</div>
        
        <div class="button-group">
            <button class="btn-start" id="startBtn">독서 시작하기</button>
            <button class="btn-complete" id="completeBtn" disabled>독서 완료하기</button>
        </div>
        
        <div class="record-section" id="recordSection">
            <div class="record-item">
                <div class="record-label">시작 시간</div>
                <div class="record-value" id="startTime">-</div>
            </div>
            <div class="record-item">
                <div class="record-label">완료 시간</div>
                <div class="record-value" id="endTime">-</div>
            </div>
            <div class="record-item">
                <div class="record-label">독서 시간</div>
                <div class="record-value" id="duration">-</div>
            </div>
            <div class="photo-preview" id="photoPreview"></div>
        </div>
        
        <button class="btn-share" id="shareBtn" disabled>공유하기</button>
    </div>

    <!-- 카메라 모달 -->
    <div class="camera-modal" id="cameraModal">
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display: none;"></canvas>
            <div class="camera-buttons">
                <button class="btn-capture" id="captureBtn">촬영하기</button>
                <button class="btn-cancel" id="cancelBtn">취소</button>
            </div>
        </div>
    </div>

    <script>
        let startTime = null;
        let endTime = null;
        let timerInterval = null;
        let stream = null;
        let capturedPhoto = null;

        const startBtn = document.getElementById('startBtn');
        const completeBtn = document.getElementById('completeBtn');
        const shareBtn = document.getElementById('shareBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const recordSection = document.getElementById('recordSection');
        const startTimeDisplay = document.getElementById('startTime');
        const endTimeDisplay = document.getElementById('endTime');
        const durationDisplay = document.getElementById('duration');
        const photoPreview = document.getElementById('photoPreview');
        const cameraModal = document.getElementById('cameraModal');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        // 독서 시작하기
        startBtn.addEventListener('click', () => {
            startTime = new Date();
            startBtn.disabled = true;
            completeBtn.disabled = false;
            recordSection.classList.remove('active');
            shareBtn.disabled = true;
            capturedPhoto = null;
            
            // 타이머 시작
            timerInterval = setInterval(updateTimer, 1000);
            updateTimer();
        });

        // 타이머 업데이트
        function updateTimer() {
            if (!startTime) return;
            
            const now = new Date();
            const elapsed = Math.floor((now - startTime) / 1000);
            
            const hours = Math.floor(elapsed / 3600);
            const minutes = Math.floor((elapsed % 3600) / 60);
            const seconds = elapsed % 60;
            
            timerDisplay.textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // 독서 완료하기
        completeBtn.addEventListener('click', async () => {
            if (!startTime) return;
            
            endTime = new Date();
            
            // 카메라 모달 열기
            cameraModal.classList.add('active');
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
            } catch (error) {
                console.error('카메라 접근 오류:', error);
                alert('카메라 접근에 실패했습니다. 브라우저 권한을 확인해주세요.');
                cameraModal.classList.remove('active');
            }
        });

        // 사진 촬영
        captureBtn.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0);
            
            capturedPhoto = canvas.toDataURL('image/png');
            
            // 스트림 정지
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            // 모달 닫기
            cameraModal.classList.remove('active');
            
            // 기록 표시
            displayRecord();
        });

        // 취소
        cancelBtn.addEventListener('click', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            cameraModal.classList.remove('active');
        });

        // 기록 표시
        function displayRecord() {
            if (!startTime || !endTime) return;
            
            const startTimeStr = formatDateTime(startTime);
            const endTimeStr = formatDateTime(endTime);
            const duration = Math.floor((endTime - startTime) / 1000);
            const durationStr = formatDuration(duration);
            
            startTimeDisplay.textContent = startTimeStr;
            endTimeDisplay.textContent = endTimeStr;
            durationDisplay.textContent = durationStr;
            
            if (capturedPhoto) {
                photoPreview.innerHTML = `<img src="${capturedPhoto}" alt="독서 인증 사진">`;
            }
            
            recordSection.classList.add('active');
            shareBtn.disabled = false;
            
            // 타이머 정지
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            
            // 버튼 상태 초기화
            startBtn.disabled = false;
            completeBtn.disabled = true;
        }

        // 날짜 시간 포맷
        function formatDateTime(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        // 시간 포맷
        function formatDuration(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            if (hours > 0) {
                return `${hours}시간 ${minutes}분 ${secs}초`;
            } else if (minutes > 0) {
                return `${minutes}분 ${secs}초`;
            } else {
                return `${secs}초`;
            }
        }

        // 공유하기
        shareBtn.addEventListener('click', async () => {
            if (!startTime || !endTime || !capturedPhoto) return;
            
            await shareContent();
        });

        // 공유 이미지 생성 (인스타그램 스토리 사이즈: 1080x1920)
        function generateShareImage() {
            return new Promise((resolve) => {
                const shareCanvas = document.createElement('canvas');
                shareCanvas.width = 1080;
                shareCanvas.height = 1920;
                const ctx = shareCanvas.getContext('2d');
                
                // 배경
                ctx.fillStyle = '#121212';
                ctx.fillRect(0, 0, shareCanvas.width, shareCanvas.height);
                
                // 제목
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 64px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('book buddy', shareCanvas.width / 2, 120);
                
                // 사진
                const img = new Image();
                img.onload = () => {
                    const photoWidth = 900;
                    const photoHeight = photoWidth * (img.height / img.width);
                    const photoX = (shareCanvas.width - photoWidth) / 2;
                    const photoY = 220;
                    
                    // 사진이 캔버스 높이를 넘지 않도록 조정
                    let finalPhotoHeight = photoHeight;
                    let finalPhotoWidth = photoWidth;
                    if (photoY + photoHeight > shareCanvas.height - 400) {
                        finalPhotoHeight = shareCanvas.height - 400 - photoY;
                        finalPhotoWidth = finalPhotoHeight * (img.width / img.height);
                    }
                    
                    const finalPhotoX = (shareCanvas.width - finalPhotoWidth) / 2;
                    ctx.drawImage(img, finalPhotoX, photoY, finalPhotoWidth, finalPhotoHeight);
                    
                    // 정보 텍스트
                    const infoY = photoY + finalPhotoHeight + 80;
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 40px Arial';
                    ctx.textAlign = 'center';
                    
                    ctx.fillText(`시작 시간`, shareCanvas.width / 2, infoY);
                    ctx.font = '36px Arial';
                    ctx.fillText(`${formatDateTime(startTime)}`, shareCanvas.width / 2, infoY + 50);
                    
                    ctx.font = 'bold 40px Arial';
                    ctx.fillText(`완료 시간`, shareCanvas.width / 2, infoY + 120);
                    ctx.font = '36px Arial';
                    ctx.fillText(`${formatDateTime(endTime)}`, shareCanvas.width / 2, infoY + 170);
                    
                    ctx.font = 'bold 40px Arial';
                    ctx.fillText(`독서 시간`, shareCanvas.width / 2, infoY + 240);
                    ctx.font = '36px Arial';
                    ctx.fillText(`${formatDuration(Math.floor((endTime - startTime) / 1000))}`, shareCanvas.width / 2, infoY + 290);
                    
                    // URL 추가
                    const urlY = shareCanvas.height - 100;
                    ctx.fillStyle = '#999999';
                    ctx.font = '28px Arial';
                    ctx.fillText('https://seovalue.github.io/reading-buddy/', shareCanvas.width / 2, urlY);
                    
                    shareCanvas.toBlob((blob) => {
                        resolve(blob);
                    }, 'image/png');
                };
                img.src = capturedPhoto;
            });
        }

        // 공유 내용 생성
        function createShareText() {
            const duration = Math.floor((endTime - startTime) / 1000);
            const durationStr = formatDuration(duration);
            return `📚 book buddy 독서 인증\n\n시작: ${formatDateTime(startTime)}\n완료: ${formatDateTime(endTime)}\n독서 시간: ${durationStr}`;
        }

        // 공유하기
        async function shareContent() {
            try {
                // 공유 이미지 생성
                const imageBlob = await generateShareImage();
                const imageFile = new File([imageBlob], 'book-buddy-cert.png', { type: 'image/png' });
                const shareText = createShareText();
                
                // Web Share API 사용 (모바일)
                if (navigator.share && navigator.canShare) {
                    const shareData = {
                        title: 'book buddy - 독서 인증',
                        text: shareText,
                        files: [imageFile]
                    };
                    
                    if (navigator.canShare(shareData)) {
                        await navigator.share(shareData);
                        return;
                    }
                }
                
                // Web Share API (파일 없이)
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'book buddy - 독서 인증',
                            text: shareText
                        });
                        return;
                    } catch (err) {
                        // 파일 공유 실패 시 텍스트만 공유
                    }
                }
                
                // 클립보드에 이미지 복사 (데스크톱 또는 대체 방법)
                try {
                    await navigator.clipboard.write([
                        new ClipboardItem({
                            'image/png': imageBlob
                        })
                    ]);
                    
                    // 클립보드에 텍스트도 복사
                    await navigator.clipboard.writeText(shareText);
                    
                    alert('이미지와 텍스트가 클립보드에 복사되었습니다!\n메신저에 붙여넣기(Ctrl+V 또는 Cmd+V)로 공유하세요.');
                } catch (clipboardError) {
                    // 클립보드 실패 시 다운로드로 대체
                    const url = URL.createObjectURL(imageBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `book-buddy-${formatDateTime(startTime).replace(/[: ]/g, '_')}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    // 텍스트도 클립보드에 복사 시도
                    try {
                        await navigator.clipboard.writeText(shareText);
                        alert('이미지가 다운로드되었고, 텍스트가 클립보드에 복사되었습니다!');
                    } catch (e) {
                        alert('이미지가 다운로드되었습니다!');
                    }
                }
            } catch (error) {
                console.error('공유 오류:', error);
                alert('공유에 실패했습니다. 다시 시도해주세요.');
            }
        }
    </script>
</body>
</html>
