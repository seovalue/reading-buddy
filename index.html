<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>book buddy</title>
    <meta property="og:title" content="book buddy - 독서 인증">
    <meta property="og:description" content="독서 시간을 기록하고 인증하세요">
    <meta property="og:type" content="website">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #121212;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            background: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 24px;
            max-width: 100%;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 32px;
            font-size: 1.75em;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .timer-display {
            text-align: center;
            font-size: 2.5em;
            font-weight: 300;
            color: #ffffff;
            margin: 32px 0;
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 2px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        button {
            width: 100%;
            padding: 16px 24px;
            font-size: 1em;
            border: 2px solid #ffffff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            background: #1e1e1e;
            color: #ffffff;
        }

        .btn-start:hover:not(:disabled) {
            background: #ffffff;
            color: #000000;
        }

        .btn-complete:hover:not(:disabled) {
            background: #ffffff;
            color: #000000;
        }

        .btn-pause {
            background: #1e1e1e;
            color: #ffffff;
            border: 2px solid #ffffff;
        }

        .btn-pause:hover:not(:disabled) {
            background: #ffffff;
            color: #000000;
        }

        .btn-resume {
            background: #1e1e1e;
            color: #ffffff;
            border: 2px solid #ffffff;
        }

        .btn-resume:hover:not(:disabled) {
            background: #ffffff;
            color: #000000;
        }

        .btn-share {
            width: 100%;
        }

        .btn-share:hover:not(:disabled) {
            background: #ffffff;
            color: #000000;
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background: #1e1e1e;
            border-color: #444444;
            color: #666666;
        }

        .record-section {
            margin-top: 24px;
            padding: 20px;
            background: #2a2a2a;
            border: 1px solid #333333;
            border-radius: 8px;
            display: none;
        }

        .record-section.active {
            display: block;
        }

        .record-item {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #333333;
        }

        .record-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .record-label {
            font-weight: 500;
            color: #999999;
            margin-bottom: 6px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .record-value {
            color: #ffffff;
            font-size: 1em;
            font-weight: 400;
        }

        .photo-preview {
            margin-top: 20px;
            text-align: center;
        }

        .share-guide {
            margin-top: 24px;
            margin-bottom: 12px;
            text-align: center;
            color: #999999;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .photo-preview img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #333333;
        }

        .btn-retake {
            width: 100%;
            margin-top: 16px;
            padding: 12px 24px;
            font-size: 0.9em;
            border: 2px solid #666666;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            background: #1e1e1e;
            color: #ffffff;
        }

        .btn-retake:hover {
            background: #333333;
            border-color: #888888;
        }

        .summary-section {
            margin-top: 20px;
        }

        .summary-section textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #333333;
            border-radius: 8px;
            background: #1e1e1e;
            color: #ffffff;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
        }

        .summary-section textarea:focus {
            outline: none;
            border-color: #ffffff;
        }

        .summary-section textarea::placeholder {
            color: #666666;
        }

        .camera-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .camera-modal.active {
            display: flex;
        }

        .camera-container {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            max-width: 95%;
            max-height: 95%;
            border: 1px solid #333333;
        }

        .camera-container video {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid #333333;
        }

        .camera-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
        }

        .camera-buttons button {
            padding: 14px 28px;
            width: 100%;
        }

        .btn-capture {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .btn-capture:hover {
            background: #cccccc;
            border-color: #cccccc;
        }

        .btn-skip {
            background: #1e1e1e;
            color: #ffffff;
            border-color: #666666;
        }

        .btn-skip:hover {
            background: #333333;
            border-color: #666666;
        }

        @media (min-width: 480px) {
            .container {
                max-width: 420px;
                padding: 32px;
            }

            h1 {
                font-size: 2em;
            }

            .timer-display {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>book buddy</h1>
        
        <div class="timer-display" id="timerDisplay">00:00:00</div>
        
        <div class="button-group">
            <button class="btn-start" id="startBtn">독서 시작하기</button>
            <button class="btn-pause" id="pauseBtn" disabled style="display: none;">일시정지</button>
            <button class="btn-resume" id="resumeBtn" disabled style="display: none;">재개</button>
            <button class="btn-complete" id="completeBtn" disabled>독서 완료하기</button>
        </div>
        
        <div class="record-section" id="recordSection">
            <div class="record-item">
                <div class="record-label">시작 시간</div>
                <div class="record-value" id="startTime">-</div>
            </div>
            <div class="record-item">
                <div class="record-label">완료 시간</div>
                <div class="record-value" id="endTime">-</div>
            </div>
            <div class="record-item">
                <div class="record-label">독서 시간</div>
                <div class="record-value" id="duration">-</div>
            </div>
            <div class="photo-preview" id="photoPreview"></div>
            <button class="btn-retake" id="retakeBtn" style="display: none;">재촬영</button>
            <div class="summary-section" id="summarySection" style="display: none;">
                <div class="record-label" style="margin-top: 20px;">한줄 요약</div>
                <textarea id="summaryInput" placeholder="오늘 읽은 부분에 대한 요약을 입력하세요 (선택사항)" rows="3"></textarea>
            </div>
        </div>
        
        <div class="share-guide" id="shareGuide" style="display: none;">
            복사하기 버튼을 누른 뒤 원하는 곳에 붙여 넣어 보세요!
        </div>
        
        <button class="btn-share" id="shareBtn" disabled>복사하기</button>
    </div>

    <!-- 카메라 모달 -->
    <div class="camera-modal" id="cameraModal">
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display: none;"></canvas>
            <div class="camera-buttons">
                <button class="btn-capture" id="captureBtn">촬영하기</button>
                <button class="btn-skip" id="skipBtn">촬영하지 않기</button>
            </div>
        </div>
    </div>

    <script>
        let startTime = null;
        let endTime = null;
        let timerInterval = null;
        let stream = null;
        let capturedPhoto = null;
        let startPhoto = null; // 시작 시 촬영한 사진
        let endPhoto = null; // 종료 시 촬영한 사진
        let pausedTime = 0; // 일시정지된 시간 누적
        let pauseStartTime = null; // 일시정지 시작 시간
        let isPaused = false;

        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const completeBtn = document.getElementById('completeBtn');
        const shareBtn = document.getElementById('shareBtn');
        const summaryInput = document.getElementById('summaryInput');
        const timerDisplay = document.getElementById('timerDisplay');
        const recordSection = document.getElementById('recordSection');
        const startTimeDisplay = document.getElementById('startTime');
        const endTimeDisplay = document.getElementById('endTime');
        const durationDisplay = document.getElementById('duration');
        const photoPreview = document.getElementById('photoPreview');
        const cameraModal = document.getElementById('cameraModal');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const skipBtn = document.getElementById('skipBtn');
        const retakeBtn = document.getElementById('retakeBtn');

        // 독서 시작하기
        startBtn.addEventListener('click', async () => {
            startTime = new Date();
            startBtn.disabled = true;
            startBtn.style.display = 'none';
            pauseBtn.disabled = false;
            pauseBtn.style.display = 'block';
            completeBtn.disabled = false;
            recordSection.classList.remove('active');
            shareBtn.disabled = true;
            startPhoto = null;
            endPhoto = null;
            capturedPhoto = null;
            pausedTime = 0;
            isPaused = false;
            document.getElementById('shareGuide').style.display = 'none';
            document.getElementById('summarySection').style.display = 'none';
            summaryInput.value = '';
            
            // 시작 시 사진 촬영
            cameraModal.classList.add('active');
            video.srcObject = null;
        });

        // 일시정지
        pauseBtn.addEventListener('click', () => {
            if (isPaused) return;
            isPaused = true;
            pauseStartTime = new Date();
            pauseBtn.disabled = true;
            pauseBtn.style.display = 'none';
            resumeBtn.disabled = false;
            resumeBtn.style.display = 'block';
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        });

        // 재개
        resumeBtn.addEventListener('click', () => {
            if (!isPaused) return;
            if (pauseStartTime) {
                pausedTime += Math.floor((new Date() - pauseStartTime) / 1000);
                pauseStartTime = null;
            }
            isPaused = false;
            resumeBtn.disabled = true;
            resumeBtn.style.display = 'none';
            pauseBtn.disabled = false;
            pauseBtn.style.display = 'block';
            timerInterval = setInterval(updateTimer, 1000);
            updateTimer();
        });

        // 타이머 업데이트
        function updateTimer() {
            if (!startTime || isPaused) return;
            
            const now = new Date();
            const elapsed = Math.floor((now - startTime) / 1000) - pausedTime;
            
            const hours = Math.floor(elapsed / 3600);
            const minutes = Math.floor((elapsed % 3600) / 60);
            const seconds = elapsed % 60;
            
            timerDisplay.textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // 독서 완료하기
        completeBtn.addEventListener('click', () => {
            if (!startTime) return;
            
            endTime = new Date();
            
            // 카메라 모달 열기 (권한은 아직 요청하지 않음)
            cameraModal.classList.add('active');
            // 비디오 초기화
            video.srcObject = null;
        });

        // 사진 촬영
        captureBtn.addEventListener('click', async () => {
            // 카메라 권한 요청 (처음 촬영하기를 누를 때만)
            if (!stream) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment' } 
                    });
                    video.srcObject = stream;
                    // 비디오가 로드되면 버튼 텍스트 변경 (선택사항)
                    video.addEventListener('loadedmetadata', function onVideoReady() {
                        video.removeEventListener('loadedmetadata', onVideoReady);
                        // 버튼을 다시 눌러야 촬영되도록 함 (자동 촬영 안 함)
                    }, { once: true });
                    return;
                } catch (error) {
                    console.error('카메라 접근 오류:', error);
                    alert('카메라 접근에 실패했습니다. 브라우저 권한을 확인해주세요.');
                    cameraModal.classList.remove('active');
                    return;
                }
            }
            
            // 이미 스트림이 있고 비디오가 준비되었으면 촬영
            if (video.videoWidth && video.videoHeight) {
                takePhoto();
            }
        });
        
        // 실제 사진 촬영 함수
        function takePhoto() {
            // 비디오가 준비되지 않았으면 대기
            if (!video.videoWidth || !video.videoHeight) {
                return;
            }
            
            // 사진 촬영
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0);
            
            const photo = canvas.toDataURL('image/png');
            
            // 스트림 정지
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            // 모달 닫기
            cameraModal.classList.remove('active');
            
            // 시작 시 촬영인지 종료 시 촬영인지 판단
            if (!startPhoto) {
                // 시작 시 촬영
                startPhoto = photo;
                // 타이머 시작
                timerInterval = setInterval(updateTimer, 1000);
                updateTimer();
            } else {
                // 종료 시 촬영
                endPhoto = photo;
                capturedPhoto = photo; // 기존 호환성을 위해
                // 기록 표시
                displayRecord();
            }
        }

        // 촬영하지 않기
        skipBtn.addEventListener('click', () => {
            // 스트림 정지 (이미 시작된 경우)
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            // 모달 닫기
            cameraModal.classList.remove('active');
            
            // 시작 시 촬영을 건너뛴 경우
            if (!startPhoto) {
                // 타이머 시작
                timerInterval = setInterval(updateTimer, 1000);
                updateTimer();
            } else {
                // 종료 시 촬영을 건너뛴 경우
                endPhoto = null;
                capturedPhoto = null;
                displayRecord();
            }
        });

        // 재촬영 (종료 사진만 재촬영)
        retakeBtn.addEventListener('click', () => {
            // 카메라 모달 열기
            cameraModal.classList.add('active');
            // 비디오 초기화
            video.srcObject = null;
            // 기존 스트림 정리
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            // 종료 사진만 재촬영하도록 설정
            endPhoto = null;
        });

        // 기록 표시
        function displayRecord() {
            if (!startTime || !endTime) return;
            
            const startTimeStr = formatDateTime(startTime);
            const endTimeStr = formatDateTime(endTime);
            const actualDuration = Math.floor((endTime - startTime) / 1000) - pausedTime;
            const durationStr = formatDuration(actualDuration);
            
            startTimeDisplay.textContent = startTimeStr;
            endTimeDisplay.textContent = endTimeStr;
            durationDisplay.textContent = durationStr;
            
            // 사진 표시 (시작 사진과 종료 사진)
            let photoHTML = '';
            if (startPhoto) {
                photoHTML += '<div style="margin-bottom: 16px;"><div class="record-label" style="margin-bottom: 8px;">시작 페이지</div><img src="' + startPhoto + '" alt="시작 페이지" style="max-width: 100%; border-radius: 8px; border: 1px solid #333333;"></div>';
            }
            if (endPhoto) {
                photoHTML += '<div><div class="record-label" style="margin-bottom: 8px;">완료 페이지</div><img src="' + endPhoto + '" alt="완료 페이지" style="max-width: 100%; border-radius: 8px; border: 1px solid #333333;"></div>';
            }
            
            if (photoHTML) {
                photoPreview.innerHTML = photoHTML;
                document.getElementById('retakeBtn').style.display = 'block';
            } else {
                photoPreview.innerHTML = '';
                document.getElementById('retakeBtn').style.display = 'none';
            }
            
            // 요약 섹션 표시
            document.getElementById('summarySection').style.display = 'block';
            
            recordSection.classList.add('active');
            // 사진 유무와 관계없이 공유 가능
            shareBtn.disabled = false;
            // 가이드 표시
            document.getElementById('shareGuide').style.display = 'block';
            
            // 버튼 상태 초기화
            startBtn.disabled = false;
            startBtn.style.display = 'block';
            pauseBtn.disabled = true;
            pauseBtn.style.display = 'none';
            resumeBtn.disabled = true;
            resumeBtn.style.display = 'none';
            completeBtn.disabled = true;
        }

        // 날짜 시간 포맷
        function formatDateTime(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        // 시간 포맷
        function formatDuration(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            if (hours > 0) {
                return `${hours}시간 ${minutes}분 ${secs}초`;
            } else if (minutes > 0) {
                return `${minutes}분 ${secs}초`;
            } else {
                return `${secs}초`;
            }
        }

        // 복사하기
        shareBtn.addEventListener('click', async () => {
            if (!startTime || !endTime) {
                return;
            }
            
            await copyImage();
        });

        // 공유 이미지 생성 (가로:세로 = 1:1.5, 1080x1620)
        function generateShareImage() {
            return new Promise((resolve) => {
                const shareCanvas = document.createElement('canvas');
                shareCanvas.width = 1080;
                shareCanvas.height = 1620;
                const ctx = shareCanvas.getContext('2d');
                
                // 배경
                ctx.fillStyle = '#121212';
                ctx.fillRect(0, 0, shareCanvas.width, shareCanvas.height);
                
                // 제목
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 64px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('book buddy', shareCanvas.width / 2, 120);
                
                let currentY = 220;
                
                // 1. 정보 텍스트 먼저 (시작 시간, 완료 시간, 독서 시간)
                const actualDuration = Math.floor((endTime - startTime) / 1000) - pausedTime;
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                
                ctx.fillText(`시작 시간`, shareCanvas.width / 2, currentY);
                ctx.font = '36px Arial';
                ctx.fillText(`${formatDateTime(startTime)}`, shareCanvas.width / 2, currentY + 50);
                
                ctx.font = 'bold 40px Arial';
                ctx.fillText(`완료 시간`, shareCanvas.width / 2, currentY + 120);
                ctx.font = '36px Arial';
                ctx.fillText(`${formatDateTime(endTime)}`, shareCanvas.width / 2, currentY + 170);
                
                ctx.font = 'bold 40px Arial';
                ctx.fillText(`총 독서 시간`, shareCanvas.width / 2, currentY + 240);
                ctx.font = '36px Arial';
                ctx.fillText(`${formatDuration(actualDuration)}`, shareCanvas.width / 2, currentY + 290);
                
                currentY += 380;
                
                // 2. 사진들 (시작 페이지, 완료 페이지)
                const photoWidth = 380;
                const photoSpacing = 20;
                const photos = [];
                if (startPhoto) photos.push({ src: startPhoto, label: '시작 페이지' });
                if (endPhoto) photos.push({ src: endPhoto, label: '완료 페이지' });
                
                // 사진들을 로드
                const loadPromises = photos.map(photo => {
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.onload = () => resolve({ ...photo, img });
                        img.src = photo.src;
                    });
                });
                
                Promise.all(loadPromises).then(loadedPhotos => {
                    // 사진 그리기
                    if (loadedPhotos.length === 2) {
                        // 두 사진을 나란히 같은 높이에 배치
                        const photoX1 = (shareCanvas.width - photoWidth * 2 - photoSpacing) / 2;
                        const photoX2 = photoX1 + photoWidth + photoSpacing;
                        
                        // 두 사진의 높이를 계산하고 더 높은 높이를 기준으로 설정
                        const photoHeights = loadedPhotos.map(photo => 
                            photoWidth * (photo.img.height / photo.img.width)
                        );
                        const maxPhotoHeight = Math.max(...photoHeights);
                        const labelY = currentY;
                        const photoStartY = currentY + 40;
                        
                        // 라벨과 사진을 같은 높이에 배치
                        loadedPhotos.forEach((photo, index) => {
                            const photoX = index === 0 ? photoX1 : photoX2;
                            const photoHeight = photoWidth * (photo.img.height / photo.img.width);
                            
                            // 라벨 (같은 높이)
                            ctx.fillStyle = '#ffffff';
                            ctx.font = 'bold 28px Arial';
                            ctx.textAlign = 'center';
                            ctx.fillText(photo.label, photoX + photoWidth / 2, labelY);
                            
                            // 사진 (같은 높이에 맞춰서 중앙 정렬)
                            const photoY = photoStartY + (maxPhotoHeight - photoHeight) / 2;
                            ctx.drawImage(photo.img, photoX, photoY, photoWidth, photoHeight);
                        });
                        
                        // 다음 요소를 위한 Y 위치 업데이트 (가장 높은 사진 기준)
                        currentY = photoStartY + maxPhotoHeight + 40;
                    } else if (loadedPhotos.length === 1) {
                        // 사진 하나만
                        const photo = loadedPhotos[0];
                        const photoX = (shareCanvas.width - photoWidth) / 2;
                        const photoHeight = photoWidth * (photo.img.height / photo.img.width);
                        
                        // 라벨
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 28px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText(photo.label, shareCanvas.width / 2, currentY);
                        
                        // 사진
                        ctx.drawImage(photo.img, photoX, currentY + 40, photoWidth, photoHeight);
                        currentY += photoHeight + 80;
                    }
                    
                    // 3. 요약 텍스트 (사진 아래에 배치, 간격 확보)
                    const summary = summaryInput.value.trim();
                    if (summary) {
                        currentY += 50; // 사진과 요약 사이 간격 확대
                        ctx.font = 'bold 36px Arial';
                        ctx.fillText(`한줄 요약`, shareCanvas.width / 2, currentY);
                        ctx.font = '30px Arial';
                        // 긴 텍스트는 줄바꿈 처리
                        const maxWidth = shareCanvas.width - 100;
                        const words = summary.split(' ');
                        let line = '';
                        let y = currentY + 45;
                        for (let word of words) {
                            const testLine = line + word + ' ';
                            const metrics = ctx.measureText(testLine);
                            if (metrics.width > maxWidth && line !== '') {
                                ctx.fillText(line, shareCanvas.width / 2, y);
                                line = word + ' ';
                                y += 38;
                            } else {
                                line = testLine;
                            }
                        }
                        ctx.fillText(line, shareCanvas.width / 2, y);
                        currentY = y + 50;
                    } else {
                        currentY += 50; // 사진이 없어도 간격 유지
                    }
                    
                    // 4. 링크 텍스트 추가
                    const linkUrl = 'https://seovalue.github.io/reading-buddy/';
                    const linkTextY = shareCanvas.height - 80;
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 32px Arial';
                    ctx.fillText('book buddy link:', shareCanvas.width / 2, linkTextY);
                    ctx.font = '28px Arial';
                    ctx.fillStyle = '#999999';
                    ctx.fillText(linkUrl, shareCanvas.width / 2, linkTextY + 40);
                    
                    shareCanvas.toBlob((blob) => {
                        resolve(blob);
                    }, 'image/png');
                });
            });
        }

        // 공유 내용 생성
        function createShareText() {
            const duration = Math.floor((endTime - startTime) / 1000);
            const durationStr = formatDuration(duration);
            return `📚 book buddy 독서 인증\n\n시작: ${formatDateTime(startTime)}\n완료: ${formatDateTime(endTime)}\n독서 시간: ${durationStr}`;
        }

        // 복사하기
        async function copyImage() {
            try {
                // 공유 이미지 생성
                const imageBlob = await generateShareImage();
                
                // 방법 1: ClipboardItem API 사용 (최신 브라우저)
                try {
                    if (navigator.clipboard && navigator.clipboard.write) {
                        await navigator.clipboard.write([
                            new ClipboardItem({
                                'image/png': imageBlob
                            })
                        ]);
                        alert('이미지가 클립보드에 복사되었습니다!\n원하는 곳에 붙여넣기(Ctrl+V 또는 Cmd+V)로 공유하세요.');
                        return;
                    }
                } catch (clipboardError) {
                    console.log('ClipboardItem API 실패, 대체 방법 시도:', clipboardError);
                }
                
                // 방법 2: 자동 다운로드 (모든 방법 실패 시, 실패 메시지 없이)
                downloadImage(imageBlob);
                
            } catch (error) {
                console.error('복사 오류:', error);
                // 에러 발생 시에도 다운로드로 전환
                try {
                    const imageBlob = await generateShareImage();
                    downloadImage(imageBlob);
                } catch (downloadError) {
                    console.error('다운로드도 실패:', downloadError);
                    alert('이미지 생성에 실패했습니다. 다시 시도해주세요.');
                }
            }
        }

        // 이미지 다운로드 함수 (실패 메시지 없이 조용히 다운로드)
        function downloadImage(imageBlob) {
            const url = URL.createObjectURL(imageBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `book-buddy-${formatDateTime(startTime).replace(/[: ]/g, '_')}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
